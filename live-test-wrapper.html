      L.push('Browser: ' + e.userAgent);
      L.push('Platform: ' + e.windowsPlatformVersion);
      L.push('secureContext=' + e.secureContext + ' crypto.subtle=' + e.cryptoSubtle + ' BroadcastChannel=' + e.broadcastChannel + ' cookies=' + e.cookiesEnabled + ' storageAccess=' + e.storageAccess);
      L.push('navigator.platformAuthentication present=' + e.platformAuthenticationApi + ' contracts=' + e.brokerContracts);
    }
    L.push('');
    L.push('T1 messaging between this page and a frame inside it (no Microsoft involved):');
    state.transport.forEach(function (t) { L.push('  ' + (t.sandbox ? 'sandboxed frame' : 'plain frame') + ': postMessage=' + (t.postMessage ? 'yes' : 'NO') + ', BroadcastChannel=' + (t.bcSupported ? (t.broadcastChannel ? 'yes' : 'NO') : 'unsupported')); });
    L.push('');
    L.push('T2 silent sign-in in a hidden frame (no MSAL):');
    state.silent.forEach(function (r) {
      var c = classify(r);
      L.push('  [' + r.variant + '] ' + c.code + ' - ' + c.text + ' | page loads: ' + r.loads.length + (r.loads.length ? ' at ' + r.loads.join(', ') + ' ms' : '') + ' | ' + r.elapsed + ' ms');
    });
    L.push('');
    L.push('T3 sign-in in a top-level popup: ' + (state.popup ? (function () { var c = classifyPopup(state.popup); return c.code + ' - ' + c.text + (state.popup.elapsed ? ' | ' + state.popup.elapsed + ' ms' : ''); })() : '(not run)'));
    return L.join('\n');
  }

  function render() {
    var app = document.getElementById('app');
    var keepLib = (document.getElementById('lib') || {}).value || '', keepFlags = (document.getElementById('flags') || {}).value || '';
    var keepShow = showFrame();
    var h = [];
    var modeText = { 'self': selfRegistered ? 'This file is its own return page and its address is already registered for the app: results are confirmed.' : 'This file is its own return page (its address must be registered in Azure for this to work).', 'app-same-origin': 'Microsoft returns to the real app page on the same site, which reports back: results are confirmed.', 'app-cross-origin': 'Microsoft returns to the real app page on ANOTHER site: the last step is inferred from page-load counts, not confirmed.' }[RETURN_MODE];
    h.push('<p class="note">Page: <b>' + esc(location.origin + location.pathname) + '</b> &mdash; framed: <b>' + isFramed() + '</b>. Nothing on this page reads or sends any token or code.<br>Return address: <b>' + esc(CONFIG.redirectUri) + '</b> &mdash; ' + esc(modeText) + '</p>');
    h.push('<p>Edge sign-in library from <code>edge://signin-internals</code>: <input id="lib" type="text" placeholder="OneAuth or WAM"> &nbsp; Started with flags: <input id="flags" type="text" placeholder="e.g. --disable-features=msOneAuthWAM"></p>');
    h.push('<p><label><input id="showframe" type="checkbox"> Show the sign-in frame while testing (to see what Microsoft displays)</label></p>');
    h.push('<p><button id="runFrames"' + (state.running ? ' disabled' : '') + '>1. Run frame tests (about 1 minute, no clicks)</button><button id="runPopup"' + (state.running ? ' disabled' : '') + '>2. Run popup test (opens a window)</button><button id="copy">3. Copy report</button></p>');
    h.push('<h3>Report</h3><pre id="report"></pre>');
    app.innerHTML = h.join('');
    showFrameEl = document.getElementById('showframe');
    document.getElementById('lib').value = keepLib; document.getElementById('flags').value = keepFlags; showFrameEl.checked = keepShow;
    document.getElementById('report').textContent = buildReport();
    document.getElementById('runFrames').onclick = runAllFrames;
    document.getElementById('runPopup').onclick = function () {
      state.running = true; render();
      runPopupTest().then(function (r) { state.popup = r; state.running = false; render(); });
    };
    document.getElementById('copy').onclick = function () {
      var text = buildReport();
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { alert('Report copied. Paste it into the chat.'); }, function () { selectReport(); });
      else selectReport();
    };
  }
  function selectReport() { var r = document.createRange(); r.selectNodeContents(document.getElementById('report')); var s = getSelection(); s.removeAllRanges(); s.addRange(r); alert('Press Ctrl+C to copy the selected report.'); }

  function runAllFrames() {
    state.running = true; state.transport = []; state.silent = []; render();
    var chain = collectEnv().then(function (env) { state.env = env; render(); });
    [true, false].forEach(function (sb) { chain = chain.then(function () { return runTransportTest(sb); }).then(function (r) { state.transport.push(r); render(); }); });
    VARIANTS.forEach(function (v) { chain = chain.then(function () { return runFrameTest(v); }).then(function (r) { state.silent.push(r); render(); }); });
    chain.then(function () { state.running = false; render(); });
  }

  function runMain() {
    render();
    collectEnv().then(function (env) { state.env = env; render(); });
  }

  // test hooks (nothing here is secret)
  window.__ssoDiag = { RETURN_MODE: RETURN_MODE, stateFor: stateFor, CONFIG: CONFIG, buildAuthorizeUrl: buildAuthorizeUrl, classify: classify, classifyPopup: classifyPopup, makePkce: makePkce, runFrameTest: runFrameTest, runTransportTest: runTransportTest, buildReport: buildReport, state: state, VARIANTS: VARIANTS };

  var st = getParam('state') || '';
  if (st.indexOf('diag.') === 0 && (getParam('code') || getParam('error'))) runReturn();
  else if (params.get('role') === 'echo') runEcho();
  else runMain();
})();
</script>
</body>
