<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Unified SSO - Live Test</title>
<!-- Self-hosted MSAL, not loaded from Microsoft's external CDN - confirmed
     earlier today that alcdn.msauth.net has real reachability issues on
     some networks (a documented Microsoft CDN reliability problem). This
     avoids depending on it at all. -->
<script src="msal-browser.min.js"></script>
<script src="live-test-module.js"></script>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; padding: 16px; background: #fafafa; }
  h2 { font-size: 14px; color: #2E74B5; }
  .box { padding: 10px; border-radius: 6px; margin: 10px 0; font-size: 12px; border: 1px solid #ccc; white-space: pre-wrap; word-break: break-all; }
  .waiting { background: #f2f2f2; color: #444; }
  .ok { background: #E2EFDA; color: #355E1B; }
  .err { background: #FDEBD3; color: #7A3B0E; }
</style>
</head>
<body>

<h2>Unified SSO module - live test (real, unmodified module logic, loaded as a separate file exactly as the real implementation guide instructs)</h2>
<div id="result" class="box waiting">Waiting for MojChatbotSso.init() to complete... (check console for full trace)</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var resultEl = document.getElementById('result');

  if (typeof MojChatbotSso === 'undefined') {
    resultEl.className = 'box err';
    resultEl.textContent = 'MojChatbotSso is not defined - live-test-module.js did not load/parse correctly.';
    return;
  }

  MojChatbotSso.init(function (result) {
    if (result.success) {
      resultEl.className = 'box ok';
      resultEl.textContent =
        'SUCCESS via method: ' + result.method + '\n\n' +
        'UPN: ' + result.upn + '\n\n' +
        'FULL TOKEN:\n' + result.token;

      var copyBtn = document.createElement('button');
      copyBtn.textContent = 'Copy token';
      copyBtn.onclick = function () { navigator.clipboard.writeText(result.token); copyBtn.textContent = 'Copied!'; };
      resultEl.parentNode.insertBefore(copyBtn, resultEl.nextSibling);
    } else {
      resultEl.className = 'box err';
      resultEl.textContent = 'FAILED\n\nerrorCode: ' + result.errorCode + '\nerrorMessage: ' + result.errorMessage;
    }
  });
});
</script>

</body>
</html>
