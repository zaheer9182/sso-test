<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Chatbot Iframe - Instrumented Test Target</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; padding: 16px; background: #fafafa; }
  h2 { font-size: 15px; color: #2E74B5; }
  .box { padding: 10px; border-radius: 6px; margin: 10px 0; font-size: 13px; border: 1px solid #ccc; white-space: pre-wrap; word-break: break-all; }
  .waiting { background: #f2f2f2; color: #444; }
  .ok { background: #E2EFDA; color: #355E1B; }
  .err { background: #FDEBD3; color: #7A3B0E; }
  #listItemsResult { font-family: Consolas, monospace; font-size: 11px; max-height: 300px; overflow: auto; }
</style>
</head>
<body>

<h2>1. Auth received from parent (SharePoint page)</h2>
<div id="authStatus" class="box waiting">Waiting for token from parent page...</div>

<h2>2. List items call (EmployeeDirectory), using the received token</h2>
<div id="listItemsStatus" class="box waiting">Not started yet.</div>
<div id="listItemsResult" class="box waiting" style="display:none;"></div>

<script>
  // ===== CONFIRM this matches your real ngrok backend URL =====
  var BACKEND_URL = "https://boxing-nucleus-reputable.ngrok-free.dev"; // UPDATE if your ngrok URL changed
  var LIST_NAME = "Employees"; // confirmed real list name in the lab SharePoint
  var COLUMNS = "Title,EmployeeEmail,EmployeeOffice"; // confirmed real, simple text columns on this list
  // ================================================================

  var authStatusEl = document.getElementById('authStatus');
  var listStatusEl = document.getElementById('listItemsStatus');
  var listResultEl = document.getElementById('listItemsResult');

  window.addEventListener('message', function (event) {
    if (!event.data || event.data.type !== 'TOKEN') return;

    var token = event.data.token;
    var upn = event.data.upn;

    if (!token || !upn) {
      authStatusEl.className = 'box err';
      authStatusEl.textContent = 'Received a TOKEN message, but token or upn was empty.\nRaw data: ' + JSON.stringify(event.data);
      return;
    }

    authStatusEl.className = 'box ok';
    authStatusEl.textContent =
      'SUCCESS - received real token and UPN from parent page:\n\n' +
      'UPN: ' + upn + '\n\n' +
      'Token (first 60 chars): ' + token.substring(0, 60) + '...\n' +
      'Token length: ' + token.length + ' characters';

    callListItems(upn);
  });

  async function callListItems(upn) {
    listStatusEl.className = 'box waiting';
    listStatusEl.textContent = 'Calling ' + BACKEND_URL + '/api/sharepoint2019/list-items ...';

    try {
      var url = BACKEND_URL + '/api/sharepoint2019/list-items'
        + '?list_name=' + encodeURIComponent(LIST_NAME)
        + '&columns=' + encodeURIComponent(COLUMNS)
        + '&cloud_upn=' + encodeURIComponent(upn);

      var response = await fetch(url, {
        headers: { 'ngrok-skip-browser-warning': 'true' },
      });

      var body = await response.json();

      if (!response.ok) {
        listStatusEl.className = 'box err';
        listStatusEl.textContent = 'FAILED - status ' + response.status;
        listResultEl.style.display = 'block';
        listResultEl.className = 'box err';
        listResultEl.textContent = JSON.stringify(body, null, 2);
        return;
      }

      listStatusEl.className = 'box ok';
      listStatusEl.textContent = 'SUCCESS - ' + (body.item_count !== undefined ? body.item_count + ' item(s) returned' : 'response received');
      listResultEl.style.display = 'block';
      listResultEl.className = 'box ok';
      listResultEl.textContent = JSON.stringify(body, null, 2);
    } catch (err) {
      listStatusEl.className = 'box err';
      listStatusEl.textContent = 'Request itself failed (network/CORS): ' + err.message;
    }
  }
</script>

</body>
</html>
